<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Notice - Mind Blaster System</title>
</head>
<body>
    <header>
        <h1>Dormitory Management System</h1>
        <nav>
            <ul>
                <li><a href="/dashboard">Dashboard</a></li>
                <li><a href="/rooms">Rooms</a></li>
                <li><a href="/complaints">Complaints</a></li>
                <li><a href="/maintenance">Maintenance</a></li>
                <li><a href="/visitors">Visitors</a></li>
                <li><a href="/notices">Notices</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <h2>Post New Notice</h2>
        
        <form method="POST" action="/notice/new">
            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
            </div>
            
            <div>
                <label for="content">Content:</label>
                <textarea id="content" name="content" rows="10" required></textarea>
            </div>
            
            <div>
                <label for="expiry_date">Expiration Date (Optional):</label>
                <input type="date" id="expiry_date" name="expiry_date">
                <small>Leave blank if no expiration date</small>
            </div>
            
            <div>
                <button type="submit">Post Notice</button>
                <a href="/notices">Cancel</a>
            </div>
        </form>
    </main>
    
    <footer>
        <p>&copy; 2025 Dormitory Management System</p>
    </footer>
</body>
</html>
